name: Python quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install dependencies
        run: pip install -r python/requirements.txt -r python/requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q python/src tests
      - name: Run tests
        env:
          PYTHONPATH: python/src
        run: pytest -q
