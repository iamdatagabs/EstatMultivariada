name: Data platform pipeline
on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "config/**"
      - "python/**"
      - "R/**"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: multivariate-data-platform
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install
        run: pip install -r python/requirements.txt -r python/requirements-dev.txt
      - name: Compile and test
        env:
          PYTHONPATH: python/src
        run: |
          python -m compileall -q python/src
          pytest -q
      - name: Validate pipeline on repository datasets
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: python/src
        run: python -m estat_multivariada.cli run --input data/raw --output data --docs-data docs/data --config config/datasets.yml
      - name: Commit data products
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [[ -n "$(git status --porcelain data/bronze data/silver data/gold docs/data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/bronze data/silver data/gold docs/data
            git commit -m "chore(data): refresh governed analytics products [skip ci]"
            git push
          fi
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
