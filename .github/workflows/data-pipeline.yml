name: Data engineering and analytics

on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "python/**"
      - "R/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/data-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/raw/**"
      - "python/**"
      - "R/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: multivariate-data-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt -r python/requirements-dev.txt
      - name: Python tests
        env:
          PYTHONPATH: python/src
        run: pytest -q
      - name: Validate and execute R PCA workflow
        run: |
          Rscript -e "parse(file='R/functions/multivariate.R'); parse(file='R/scripts/run_multivariate.R')"
          Rscript R/scripts/run_multivariate.R data/raw/Euroemp.csv /tmp/r-multivariate
      - name: Run ETL, analytics and ML
        env:
          PYTHONPATH: python/src
        run: python -m estat_multivariada.cli run --input data/raw --output data --docs-data docs/data
      - name: Commit generated data products
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain data/bronze data/silver data/gold docs/data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/bronze data/silver data/gold docs/data
            git commit -m "chore(data): refresh analytics artifacts [skip ci]"
            git push
          fi
      - name: Upload BI site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request'
    needs: pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
